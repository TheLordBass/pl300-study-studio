<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PL-300 Studio — Power BI Data Analyst exam prep with simulators, DAX labs, flashcards and progress tracking." />
    <meta name="theme-color" content="#0f1712" />
    <title>PL-300 Studio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f6b4f'/%3E%3Crect x='5' y='12' width='3.2' height='7' rx='.8' fill='%23fffdf7'/%3E%3Crect x='10.4' y='8' width='3.2' height='11' rx='.8' fill='%23fffdf7'/%3E%3Crect x='15.8' y='4.5' width='3.2' height='14.5' rx='.8' fill='%23fffdf7'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
    />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('pl300_theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
